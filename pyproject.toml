[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "lightgbm-rust"
version = "0.4.0"
description = "Pure-Rust re-implementation of LightGBM with a LightGBM-like Python API (work in progress)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["narwhals>=1.15", "numpy>=1.24"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/zrluety/lightgbm-rust"
Repository = "https://github.com/zrluety/lightgbm-rust"
Issues = "https://github.com/zrluety/lightgbm-rust/issues"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
scipy = ["scipy>=1.10"]

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "pytest>=8",
    "pytest-timeout>=2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    # imported by upstream's python_package_test suite
    "cloudpickle>=3",
    "joblib>=1.3",
    "psutil>=5",
    "pyarrow>=15",
    "polars>=1",
    # plotting (graphviz also needs the `dot` executable)
    "matplotlib>=3.7",
    "graphviz>=0.20",
    # Reference engine for differential tests only. Never imported by lightgbm_rust.
    "lightgbm==4.7.0",
]

[tool.maturin]
manifest-path = "crates/lgbm-py/Cargo.toml"
python-source = "python"
module-name = "lightgbm_rust._lightgbm_rust"
features = ["pyo3/extension-module"]
# The Cargo manifest lives below the workspace root, so maturin declares these
# license files in metadata without putting them in the sdist unless included.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
]

[tool.uv]
# The extension is built explicitly with `uv run maturin develop --release`;
# keeping it out of `uv sync` avoids silently rebuilding or reverting it.
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/differential"]
