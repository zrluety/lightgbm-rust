[workspace]
resolver = "3"
members = ["crates/lgbm-core", "crates/lgbm-py"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.86"
repository = "https://github.com/zrluety/lightgbm-rust"

[workspace.dependencies]
rayon = "1.12"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
